<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precios 💰</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background: #f8f9fa;
      padding-top: 50px;
    }
    .calculator {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .result {
      font-size: 1.5rem;
    }
    .emoji {
      font-size: 2rem;
    }
    table {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="calculator animate__animated animate__fadeIn">
      <h2 class="text-center mb-4">Calculadora de Precio de Venta 💵</h2>
      <div class="mb-3">
        <label for="concepto" class="form-label">Nombre del producto</label>
        <input type="text" class="form-control" id="concepto" placeholder="Ej: Camiseta">
      </div>
      <div class="mb-3">
        <label for="costo" class="form-label">Costo base del producto ($)</label>
        <input type="number" class="form-control" id="costo" placeholder="Ej: 50">
      </div>
      <div class="mb-3">
        <label for="ganancia" class="form-label">Porcentaje de ganancia (%)</label>
        <input type="number" class="form-control" id="ganancia" placeholder="Ej: 30">
      </div>
      <button class="btn btn-primary w-100" onclick="calcularPrecio()">Calcular 🧮</button>

      <div id="resultado" class="mt-4 text-center d-none animate__animated animate__fadeInUp">
        <p class="result">💲Precio sugerido: <strong id="precioFinal"></strong></p>
        <p class="result">📈 Ganancia: <strong id="margenGanancia"></strong></p>
      </div>
    </div>

    <div class="mt-5">
      <h4 class="text-center mb-3">Historial de productos calculados 📋</h4>
      <div class="table-responsive">
        <table class="table table-bordered table-striped" id="tablaProductos">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Producto</th>
              <th>Costo Base ($)</th>
              <th>% Ganancia</th>
              <th>Precio Sugerido ($)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-success" onclick="exportarExcel()">Exportar a Excel 📗</button>
        <button class="btn btn-danger" onclick="exportarPDF()">Exportar a PDF 📄</button>
      </div>
    </div>
  </div>

  <script>
    let contador = 0;

    function calcularPrecio() {
      const concepto = document.getElementById('concepto').value.trim();
      const costo = parseFloat(document.getElementById('costo').value);
      const ganancia = parseFloat(document.getElementById('ganancia').value);
      const resultadoDiv = document.getElementById('resultado');

      if (!concepto || isNaN(costo) || isNaN(ganancia) || costo < 0 || ganancia < 0) {
        alert("Por favor, completa correctamente todos los campos.");
        return;
      }

      const precioFinal = costo + (costo * ganancia / 100);
      const margenGanancia = precioFinal - costo;

      document.getElementById('precioFinal').textContent = `$${precioFinal.toFixed(2)}`;
      document.getElementById('margenGanancia').textContent = `$${margenGanancia.toFixed(2)}`;

      resultadoDiv.classList.remove('d-none');

      agregarAFila(concepto, costo, ganancia, precioFinal);
    }

    function agregarAFila(concepto, costo, ganancia, precio) {
      contador++;
      const tabla = document.getElementById('tablaProductos').querySelector('tbody');
      const fila = tabla.insertRow();
      fila.insertCell(0).innerText = contador;
      fila.insertCell(1).innerText = concepto;
      fila.insertCell(2).innerText = `$${costo.toFixed(2)}`;
      fila.insertCell(3).innerText = `${ganancia.toFixed(2)}%`;
      fila.insertCell(4).innerText = `$${precio.toFixed(2)}`;
    }

    function exportarExcel() {
      const tabla = document.getElementById('tablaProductos');
      const wb = XLSX.utils.table_to_book(tabla, {sheet: "Productos"});
      XLSX.writeFile(wb, "productos_calculados.xlsx");
    }

    async function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Productos Calculados", 14, 16);

      const tabla = document.getElementById("tablaProductos");
      const filas = Array.from(tabla.querySelectorAll("tbody tr")).map(row =>
        Array.from(row.querySelectorAll("td")).map(cell => cell.textContent)
      );
      const headers = ["#", "Producto", "Costo Base", "% Ganancia", "Precio Sugerido"];

      doc.autoTable({ head: [headers], body: filas, startY: 20 });
      doc.save("productos_calculados.pdf");
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
